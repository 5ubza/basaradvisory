name: jobhunt daily

on:
  schedule:
    - cron: "0 2 * * *"        # 05:00 Riyadh / Doha (UTC+3) every day
  workflow_dispatch:
    inputs:
      no_llm:
        description: "Skip Claude (deterministic tailoring only)"
        type: boolean
        default: false
      max_tailor:
        description: "Max tailored CVs this run"
        default: "5"

permissions:
  contents: write            # to commit the hashed seen-state back

concurrency:
  group: jobhunt
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobhunt/requirements.txt
      - run: pip install -r jobhunt/requirements.txt
      - name: Unit tests (parsers against saved HTML)
        run: python -m pytest -q jobhunt/tests
      - name: Show source status
        working-directory: jobhunt
        run: python -m jobhunt sources
        env:
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          JOOBLE_API_KEY_SA: ${{ secrets.JOOBLE_API_KEY_SA }}
          JOOBLE_API_KEY_QA: ${{ secrets.JOOBLE_API_KEY_QA }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Run pipeline
        timeout-minutes: 25
        working-directory: jobhunt
        run: >
          python -m jobhunt run
          --max-tailor "${{ github.event.inputs.max_tailor || '5' }}"
          ${{ github.event.inputs.no_llm == 'true' && '--no-llm' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          JOOBLE_API_KEY_SA: ${{ secrets.JOOBLE_API_KEY_SA }}
          JOOBLE_API_KEY_QA: ${{ secrets.JOOBLE_API_KEY_QA }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Upload outputs (digest, CSV/JSON, tailored CVs) - kept 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobhunt-${{ github.run_id }}
          path: jobhunt/out/
          retention-days: 30
          if-no-files-found: ignore
      - name: Commit seen-state (hashes only)
        run: |
          git config user.name "jobhunt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobhunt/state/seen.json
          git diff --cached --quiet || git commit -m "jobhunt: update seen-state $(date -u +%F)"
          git push
