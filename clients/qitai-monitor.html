<title>Client Deliverables — Basar Advisory</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B2A4A;--steel:#8FA8C8;--cream:#F7F4EF;--muted:#6b6b6b;--border:#d8d0c4;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',sans-serif}
body{font-family:var(--sans);background:var(--cream);min-height:100vh;display:flex;flex-direction:column;
align-items:center;justify-content:center;padding:2rem}
.box{width:100%;max-width:420px;text-align:center}
.brand{font-family:var(--serif);font-size:1.05rem;font-weight:600;color:var(--navy);letter-spacing:.03em;margin-bottom:2.2rem}
.brand a{color:inherit;text-decoration:none}
h1{font-family:var(--serif);font-weight:300;font-size:2.4rem;color:var(--navy);line-height:1.2}
h1 em{font-style:italic;color:var(--steel)}
.ar{font-size:.95rem;color:var(--muted);margin:.4rem 0 2rem}
form{display:flex;gap:.6rem}
input{flex:1;padding:.85rem 1rem;border:1px solid var(--border);border-radius:4px;background:#fff;
font-family:var(--sans);font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;outline:none}
input:focus{border-color:var(--navy)}
button{padding:.85rem 1.5rem;background:var(--navy);color:#fff;border:0;border-radius:4px;
font-family:var(--sans);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
button:hover{background:#2a3f6f}
button:disabled{opacity:.6;cursor:wait}
.err{color:#a33a3a;font-size:.85rem;margin-top:1rem;min-height:1.4em;visibility:hidden}
.err.on{visibility:visible}
.hint{font-size:.78rem;color:var(--muted);margin-top:2.4rem;line-height:1.7}
.hint a{color:var(--navy)}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><a href="/">BASAR ADVISORY</a></div>
  <h1>For <em>Clients</em></h1>
  <div class="ar">بوابة العملاء — أدخل رمز الوصول الخاص بكم</div>
  <form id="f">
    <input id="c" type="password" placeholder="ACCESS CODE" autocomplete="off" autofocus>
    <button id="b" type="submit">Unlock</button>
  </form>
  <div class="err" id="e">Invalid access code · رمز غير صحيح</div>
  <div class="hint">Access codes are issued per engagement and are personal.<br>

</div>

const ITER = 310000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryOpen(code) {
  const norm = code.trim().toUpperCase();
